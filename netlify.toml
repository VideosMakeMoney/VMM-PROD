# Démo Netlify. L'indexation reste coupée tant que VMM_ALLOW_INDEX n'est pas "true" en contexte production.
# Ne pas brancher le domaine videosmakemoney.ca sans l'accord de Max.
[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Lancement : passer VMM_ALLOW_INDEX à "true" ICI seulement, avec l'accord de Max.
# Cela active l'indexation ET les redirections forcées www / vmm-prod.netlify.app → videosmakemoney.ca.
[context.production.environment]
  VMM_ALLOW_INDEX = "false"

# Deploy previews et branch deploys : toujours noindex (build.mjs l'impose aussi via CONTEXT).
[context.deploy-preview.environment]
  VMM_ALLOW_INDEX = "false"

[context.branch-deploy.environment]
  VMM_ALLOW_INDEX = "false"

# Domaine final : https://videosmakemoney.ca (sans www). Indexé seulement en contexte production.
# Deploy previews et branch deploys : toujours noindex.
[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Lancement (fusion par Max après le changement DNS de JD) : indexation activée en production,
# avec les redirections forcées www / vmm-prod.netlify.app → videosmakemoney.ca.
[context.production.environment]
  VMM_ALLOW_INDEX = "true"

# Deploy previews et branch deploys : toujours noindex (build.mjs l'impose aussi via CONTEXT).
[context.deploy-preview.environment]
  VMM_ALLOW_INDEX = "false"

[context.branch-deploy.environment]
  VMM_ALLOW_INDEX = "false"

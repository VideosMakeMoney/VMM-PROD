name: tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, tests-regression ]
  workflow_dispatch:

permissions:
  contents: write  # TEMP PR M : régénération des snapshots clients, à retirer

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}  # TEMP PR M

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Build static site
        env:
          VMM_ALLOW_INDEX: 'true'
        run: node build.mjs

      - name: TEMP PR M — régénérer les snapshots des 4 pages clients
        env:
          VMM_ALLOW_INDEX: 'true'
        run: |
          npx playwright test tests/visual.spec.ts --grep "client-(tapis-rouge|pur-construction|hors-pair|bluewise)-(fr|en)$" --update-snapshots --workers=4 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add tests/__snapshots__/visual.spec.ts/
          git status --short
          git diff --cached --quiet || (git commit -m "PR M — snapshots des 4 pages clients régénérés (ordre des vidéos)" && git push origin HEAD:${{ github.head_ref || github.ref_name }})

      - name: Run Playwright tests
        env:
          VMM_ALLOW_INDEX: 'true'
        run: npm test -- --workers=4

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

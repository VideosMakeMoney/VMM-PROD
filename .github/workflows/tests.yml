name: tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, tests-regression ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/contact-doublon

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Build static site
        env:
          VMM_ALLOW_INDEX: 'true'
        run: node build.mjs

      - name: TEMP PR G - snapshots contact
        env:
          VMM_ALLOW_INDEX: 'true'
        run: npx playwright test tests/visual.spec.ts --grep "contact-(fr|en)$" --update-snapshots --workers=4 || true

      - name: TEMP PR G - commit snapshots contact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add tests/__snapshots__/visual.spec.ts/contact-*
          git status --short
          git diff --cached --quiet || git commit -m "PR G — snapshots /contact et /en/contact régénérés en CI"
          git push origin HEAD:refs/heads/fix/contact-doublon

      - name: Run Playwright tests
        env:
          VMM_ALLOW_INDEX: 'true'
        run: npm test -- --workers=4

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

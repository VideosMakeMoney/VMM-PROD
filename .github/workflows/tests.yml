name: tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, tests-regression ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Build static site
        env:
          VMM_ALLOW_INDEX: 'true'
        run: node build.mjs

      - name: TEMP update About snapshots (PR J, approved by Natasha)
        env:
          VMM_ALLOW_INDEX: 'true'
        run: |
          npx playwright test tests/visual.spec.ts --grep "apropos-(fr|en)$" --update-snapshots=changed --workers=4 || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tests/__snapshots__
          git commit -m "Snapshots À propos #vision mobile (PR J)" || echo nothing
          git push

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
